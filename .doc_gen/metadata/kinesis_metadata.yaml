kinesis_Scenario:
  title: Learn &AWSKinesis; basics using an &AWS; SDK
  title_abbrev: Learn &AWSKinesis; basics
  synopsis: learn &AWSKinesis; basics.
  synopsis_list:
  - List existing data streams.
  - Create a provisioned-mode data stream with 2 shards.
  - Write a single record and a batch of records.
  - Read records back from a shard.
  - Describe the stream summary.
  - Scale the stream from 2 to 4 shards.
  - Delete the stream.
  category: Basics
  languages:
    Python:
      versions:
      - sdk_version: 3
        github: python/example_code/kinesis
        excerpts:
        - description: Run an interactive scenario at a command prompt.
          snippet_tags:
          - python.example_code.kinesis.KinesisScenario
        - description: Create a class that wraps Kinesis Data Streams operations.
          snippet_tags:
          - python.example_code.kinesis.KinesisStreamWrapper.decl
  services:
    kinesis: {ListStreams: null, CreateStream: null, DescribeStream: null, PutRecord: null, PutRecords: null, GetShardIterator: null, GetRecords: null, DescribeStreamSummary: null, UpdateShardCount: null, DeleteStream: null}
